spring.application.name=device-connectivity-monitor

# Path to the adb binary. Override with -Dadb.path=... if it's not on your PATH.
adb.path=C:/Program Files/platform-tools/adb.exe

# How often (ms) to poll connected devices for status.
monitor.poll-interval-ms=15000

# The API can take screenshots and read processes from connected devices and has no login, so it
# only listens on this machine. Change to 0.0.0.0 only behind an authenticating proxy.
server.address=127.0.0.1
